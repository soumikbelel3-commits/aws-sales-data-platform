[project]
name = "aws-sales-data-platform"
version = "0.1.0"
description = "Real-time and batch sales analytics platform on AWS"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "lambda_functions/ingest_order"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["validation", "generate_data", "upload_to_s3", "handler"]
